name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Corpus is valid and generated files are current
        shell: bash
        run: |
          python tools/build.py
          git diff --exit-code -- src/negaresh/data skills/negaresh/references docs
      - name: Tests
        run: python -m pytest -q tests
      - name: Server starts
        run: negaresh doctor
