name: release

# Publishes the Python package to PyPI (trusted publishing, no token) and the
# server to the official MCP Registry (GitHub OIDC, no token).
# Runs when a GitHub release is published, or by hand from the Actions tab.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    # A manual run publishes only from main, never from an untested branch.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Test
        run: |
          uv pip install -e ".[dev]"
          python tools/build.py --check
          python -m pytest -q tests
      - name: Versions agree
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$v" = "$(jq -r .version server.json)"
          test "$v" = "$(jq -r '.packages[0].version' server.json)"
          test "$v" = "$(jq -r .version .claude-plugin/plugin.json)"
          test "$v" = "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"
          test "$v" = "$(jq -r .version gemini-extension.json)"
          test "$v" = "$(python -c 'import negaresh; print(negaresh.__version__)')"
          test "$v" = "$(python -c "import json;print(json.load(open('src/negaresh/data/corpus.json',encoding='utf-8'))['corpus_version'].split('+')[0])")"
      - name: Build
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/negaresh
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PyPI to serve the new version
        run: |
          v=$(jq -r .version server.json)
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/negaresh/$v/json" >/dev/null && exit 0
            sleep 10
          done
          echo "PyPI does not show negaresh $v yet" && exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
